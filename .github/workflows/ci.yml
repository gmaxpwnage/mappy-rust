name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # winit/softbuffer load X11 and Wayland at runtime; cpal needs ALSA.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Engine throughput
        run: cargo run --release --locked -p mappy-player -- bench

  headless:
    name: build without window or audio (portability check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build core and headless frontend
        run: cargo build --release --locked --no-default-features -p mappy-player
      - name: Test core crates
        run: cargo test --release --locked -p mos6502 -p nes -p mappy-rom
