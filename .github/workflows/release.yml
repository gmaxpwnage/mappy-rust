name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: zip
          # Intel macOS is cross-compiled on the arm64 runner: GitHub retired
          # the macos-13 Intel images, and Apple's toolchain targets both.
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # winit/softbuffer load the window system at runtime (X11 or Wayland);
      # cpal links ALSA, so the dev package is needed to build.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev

      - name: Build the game and the recompiler
        run: cargo build --release --locked --target ${{ matrix.target }} -p mappy-player -p recompiler

      - name: Assemble the archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          name="mappy-${version}-${{ matrix.name }}"
          echo "NAME=$name" >> "$GITHUB_ENV"
          mkdir -p "dist/$name"
          cp README.md NOTICE LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp "target/${{ matrix.target }}/release/mappy" "dist/$name/"
          cp "target/${{ matrix.target }}/release/recompiler" "dist/$name/"
          chmod +x "dist/$name/mappy" "dist/$name/recompiler"

      - name: Assemble the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "0.1.0" }
          $name = "mappy-$version-${{ matrix.name }}"
          "NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item README.md, NOTICE, LICENSE-MIT, LICENSE-APACHE -Destination "dist/$name"
          Copy-Item "target/${{ matrix.target }}/release/mappy.exe" -Destination "dist/$name"
          Copy-Item "target/${{ matrix.target }}/release/recompiler.exe" -Destination "dist/$name"

      - name: Create tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf "dist/${NAME}.tar.gz" -C dist "$NAME"

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:NAME" -DestinationPath "dist/$env:NAME.zip"

      - name: Create zip (macOS)
        if: runner.os == 'macOS' && matrix.archive == 'zip'
        shell: bash
        run: cd dist && zip -q -r "${NAME}.zip" "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error


  webos:
    name: build webOS TV package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: webos

      - name: Add the webOS ARM target
        run: rustup target add armv7-unknown-linux-gnueabi

      - name: Install qemu (runs the ARM engine selftest)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - uses: ./.github/actions/webos-sdk

      - name: Build the IPK and its Homebrew manifest
        env:
          QEMU_ARM: qemu-arm-static
        run: |
          python3 tools/build_webos.py \
            --sdk "$WEBOS_SDK" \
            --out dist/webos \
            --base-url https://github.com/gmaxpwnage/mappy-rust/releases/latest/download \
            --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: webos
          path: dist/webos
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, webos]
    # Only a tag push publishes; workflow_dispatch is a build smoke test.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.ipk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check that every platform produced an archive
        run: |
          set -euo pipefail
          total=$(ls dist/*.tar.gz dist/*.zip dist/*.ipk 2>/dev/null | wc -l)
          echo "$total artifacts"
          [ "$total" -ge 6 ] || { echo "expected 6 artifacts, got $total"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.ipk
            dist/manifest.json
            dist/icon320.png
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES.md
