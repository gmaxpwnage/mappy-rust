name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'webos/**'
      - 'crates/**'
      - 'tools/build_webos.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/actions/webos-sdk/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build the WebAssembly site and the webOS package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Add the webOS ARM target
        run: rustup target add armv7-unknown-linux-gnueabi

      # On Ubuntu 26.04 qemu-user-static is only a virtual package; the
      # emulators live in qemu-user as /usr/bin/qemu-<arch>.
      - name: Install qemu (runs the ARM engine selftest)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user

      - uses: ./.github/actions/webos-sdk

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build the wasm module
        run: cargo build --release --locked --target wasm32-unknown-unknown -p mappy-web

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site
          cp web/index.html web/mappy.js web/style.css site/
          cp target/wasm32-unknown-unknown/release/mappy_web.wasm site/mappy.wasm
          ls -l site

      - name: Build the native webOS IPK and the Homebrew Channel repository
        env:
          QEMU_ARM: qemu-arm
        run: |
          python3 tools/build_webos.py \
            --sdk "$WEBOS_SDK" \
            --out site/webos \
            --base-url "${{ steps.pages.outputs.base_url }}/webos" \
            --selftest

      - name: Smoke test the module (renders a frame, produces audio)
        run: node web/smoke.js site/mappy.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
