[package]
name = "mappy-rom"
description = "Mappy (Japan) (En), statically recompiled from 6502 machine code to Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mos6502 = { path = "../mos6502", default-features = false }
nes = { path = "../nes", default-features = false }

[features]
default = ["std"]
std = ["nes/std", "mos6502/std"]
